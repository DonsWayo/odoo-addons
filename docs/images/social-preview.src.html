<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html{width:1280px;height:640px;overflow:hidden}
body{width:1280px;height:640px;font-family:-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
 background:#1b1420;color:#f4f1f6;overflow:hidden;position:relative}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;
 background:radial-gradient(circle,rgba(113,75,103,.55) 0%,rgba(113,75,103,0) 62%);
 top:-380px;right:-260px}
.grid{position:absolute;inset:0;opacity:.16;
 background-image:linear-gradient(rgba(255,255,255,.10) 1px,transparent 1px),
 linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px);background-size:56px 56px}
.wrap{position:relative;padding:74px 84px;height:100%;display:flex;flex-direction:column;justify-content:center}
.eyebrow{display:inline-flex;align-items:center;gap:11px;font-size:19px;letter-spacing:.16em;
 text-transform:uppercase;color:#c9aec0;font-weight:600;margin-bottom:26px}
.dot{width:11px;height:11px;border-radius:50%;background:#8f6a84;box-shadow:0 0 18px #8f6a84}
h1{font-size:112px;line-height:1;font-weight:800;letter-spacing:-.035em;margin-bottom:24px}
h1 span{color:#c69ab8}
p.tag{font-size:33px;line-height:1.35;color:#d9cfd8;font-weight:400;max-width:880px;margin-bottom:38px}
.term{display:inline-block;background:rgba(0,0,0,.42);border:1px solid rgba(198,154,184,.34);
 border-radius:11px;padding:16px 24px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
 font-size:23px;color:#e6d8e4;margin-bottom:40px}
.term b{color:#9ad1a5;font-weight:600}
.chips{display:flex;gap:14px;flex-wrap:wrap}
.chip{border:1px solid rgba(198,154,184,.40);border-radius:999px;padding:11px 22px;
 font-size:20px;color:#e3d5e0;background:rgba(198,154,184,.09)}
.foot{position:absolute;bottom:44px;right:84px;text-align:right;font-size:20px;color:#a68fa0}
.foot b{color:#d7c3d2;font-weight:600;display:block;font-size:23px;margin-bottom:5px}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="wrap">
  <div class="eyebrow"><span class="dot"></span>Odoo 19 module</div>
  <h1>Odoo<span>Git</span></h1>
  <p class="tag">Self-hosted Git repositories as first-class Odoo records.</p>
  <div class="term"><b>$</b> git clone https://odoo.example/git/team/payments-api.git</div>
  <div class="chips">
    <span class="chip">Smart HTTP</span>
    <span class="chip">Pull requests &amp; reviews</span>
    <span class="chip">Access tokens</span>
    <span class="chip">Branch protection</span>
    <span class="chip">Webhooks</span>
  </div>
</div>
<div class="foot"><b>LGPL-3</b>github.com/DonsWayo/odoogit</div>
</body></html>
