<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html{width:1280px;height:640px;overflow:hidden;background:#221a28}
body{width:1280px;height:640px;overflow:hidden;
 font-family:-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
 background:linear-gradient(150deg,#221a28 0%,#2e2136 55%,#3a2942 100%);
 color:#f6f3f7;display:flex;align-items:center;padding:0 60px;gap:48px;position:relative}
.glow{position:absolute;width:760px;height:760px;border-radius:50%;top:-330px;right:-230px;
 background:radial-gradient(circle,rgba(198,154,184,.34) 0%,rgba(198,154,184,0) 62%)}
.left{position:relative;width:455px;flex:none}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:20px;letter-spacing:.15em;
 text-transform:uppercase;color:#c9aec0;font-weight:700;margin-bottom:18px}
.dot{width:10px;height:10px;border-radius:50%;background:#c69ab8;box-shadow:0 0 16px #c69ab8}
h1{font-size:76px;line-height:1.02;font-weight:800;letter-spacing:-.03em;margin-bottom:18px}
h1 span{color:#c69ab8}
p{font-size:26px;line-height:1.35;color:#ded4dc;margin-bottom:24px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid rgba(198,154,184,.45);background:rgba(198,154,184,.12);
 border-radius:999px;padding:9px 18px;font-size:19px;color:#eadfe8}
.shot{position:relative;flex:1;height:400px;border-radius:14px;overflow:hidden;
 box-shadow:0 26px 60px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.16)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
</style></head><body>
<div class="glow"></div>
<div class="left">
  <div class="eyebrow"><span class="dot"></span>Odoo 19</div>
  <h1>Git <span>Hosting</span></h1>
  <p>Real Git repositories, inside your Odoo.</p>
  <div class="chips"><span class="chip">Clone &amp; push</span><span class="chip">Pull requests</span><span class="chip">Code review</span></div>
</div>
<div class="shot"><img src="kanban.png"/></div>
</body></html>
