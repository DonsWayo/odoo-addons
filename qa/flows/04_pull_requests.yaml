name: Pull requests list and form with merge actions
session: qa-prs
steps:
  - open: /web/login
  - wait_load: true
  - fill_label: "Email"
    value: $USER
  - fill_label: "Password"
    value: $PASS
  - press: Enter
  - wait: 3000
  - open: /odoo/action-odoogit.action_git_pull_request
  - wait: 3500
  - assert_text: "Pull Requests"
  - assert_text: "Status"
  - assert_no_text: "A css error occured"
  - screenshot: pr_list.png
  - click_row: "Add spanish greeting"
    optional: true
  - wait: 3000
  - assert_text: "Description"
    optional: true
  - snapshot: true
  - screenshot: pr_form.png
  - sleep_console_mark: true
  - wait: 2000
  - console_clean: true
