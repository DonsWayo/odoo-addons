name: Repository form with branches tab
session: qa-repoform
steps:
  - open: /web/login
  - wait_load: true
  - fill_label: "Email"
    value: $USER
  - fill_label: "Password"
    value: $PASS
  - press: Enter
  - wait: 3000
  - open: /odoo/action-odoogit.action_git_repository
  - wait: 3500
  - click_row: "hello-world"
  - wait: 3000
  - assert_text: "Branches"
  - assert_no_text: "A css error occured"
  - snapshot: true
  - screenshot: repository_form.png
  - sleep_console_mark: true
  - wait: 2000
  - console_clean: true
