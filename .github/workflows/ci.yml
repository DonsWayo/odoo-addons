name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Every XML file parses
        run: |
          python -c "
          from xml.etree import ElementTree as ET
          import glob, sys
          files = glob.glob('dw_git/**/*.xml', recursive=True)
          assert files, 'no XML files found'
          for f in files:
              ET.parse(f)
          print(f'XML OK ({len(files)} files)')
          "

      - name: Every Python file parses
        run: |
          python -c "
          import ast, glob
          files = glob.glob('dw_git/**/*.py', recursive=True)
          assert files, 'no Python files found'
          for f in files:
              ast.parse(open(f).read(), filename=f)
          print(f'PY OK ({len(files)} files)')
          "

      - name: Lint (ruff)
        # F821 (undefined name) would have caught the NameError that shipped
        # in 19.0.1.0.0: `import os as _os` at the top, `os.makedirs(...)` in
        # the body. That is why this is a gate, not advisory.
        run: |
          pipx run ruff check --config ruff.toml dw_git/ --output-format=github

      - name: Manifest is a valid literal and declares a version
        run: |
          python -c "
          import ast
          src = open('dw_git/__manifest__.py').read()
          m = ast.literal_eval(src[src.index('{'):])
          assert m['version'].startswith('19.0.'), m['version']
          assert m['author'] and 'Your Company' not in m['author']
          assert m['license'] == 'LGPL-3'
          print('manifest OK', m['version'])
          "

      - name: Declared asset files exist
        # A missing asset is not a build failure in Odoo: the bundle just
        # logs "Could not get content for <path>" and the page renders
        # unstyled. Renaming a module and forgetting to rename the SCSS
        # inside it did exactly that, and nothing else in the pipeline
        # noticed.
        run: |
          python -c "
          import ast, glob, os, sys
          missing = []
          for mf in glob.glob('*/__manifest__.py'):
              mod = os.path.dirname(mf)
              src = open(mf).read()
              man = ast.literal_eval(src[src.index('{'):])
              for paths in man.get('assets', {}).values():
                  for entry in paths:
                      p = entry[0] if isinstance(entry, (list, tuple)) else entry
                      if '*' in p:
                          continue
                      if not os.path.isfile(p):
                          missing.append(p)
          if missing:
              sys.exit('assets declared but absent: ' + ', '.join(missing))
          print('asset files OK')
          "

      - name: Declared data files exist
        run: |
          python -c "
          import ast, os, sys
          src = open('dw_git/__manifest__.py').read()
          m = ast.literal_eval(src[src.index('{'):])
          missing = [f for f in m.get('data', []) + m.get('demo', [])
                     if not os.path.isfile(os.path.join('dw_git', f))]
          if missing:
              sys.exit('declared but absent: ' + ', '.join(missing))
          print('data files OK')
          "

  tests:
    name: Install + test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker compose build odoo

      - name: Start stack
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U odoo >/dev/null 2>&1; then
              echo "postgres ready"; break
            fi
            sleep 2
          done

      - name: Install module into a clean database (with demo data)
        run: |
          docker compose exec -T odoo odoo -d ci -i dw_git --stop-after-init \
            --db_host=postgres --db_user=odoo --db_password=odoo --workers=0 \
            2>&1 | tee install.log

      - name: Install log is free of latent failures
        run: |
          # Odoo boots straight through these; each one hid a real defect
          # in the August 2026 audit.
          for pattern in "Invalid field" "Template not found" "have no access rules" "unknown parameter" "CRITICAL"; do
            if grep -q "$pattern" install.log; then
              echo "::error::install log contains '$pattern'"
              grep "$pattern" install.log
              exit 1
            fi
          done
          echo "install log clean"

      - name: Run the test suite
        run: |
          docker compose exec -T odoo odoo -d ci --test-enable --test-tags /dw_git \
            --stop-after-init --http-port=8070 \
            --db_host=postgres --db_user=odoo --db_password=odoo --workers=0 \
            2>&1 | tee test.log

      - name: Assert the suite was green and actually ran
        run: |
          grep -E "odoo.tests.stats: dw_git: [0-9]+ tests" test.log || {
            echo "::error::no dw_git tests ran"; exit 1; }
          if ! grep -q "0 failed, 0 error(s)" test.log; then
            echo "::error::test failures"
            grep -E "^(FAIL|ERROR): |tests when loading" test.log || true
            exit 1
          fi
          grep -oE "dw_git: [0-9]+ tests" test.log | tail -1

      - name: Assert browser tours actually ran
        run: |
          # Odoo SKIPS tours when Chrome or websocket-client is missing and
          # still reports "0 failed". Every tour in this module was skipped
          # for the life of the project and read as passing. A green suite
          # that skipped the browser layer must not be green.
          if grep -qE "skipped .*(Chrome|websocket-client|devtools port)" test.log; then
            echo "::error::browser tours were SKIPPED, not passed"
            grep -E "skipped .*(Chrome|websocket-client|devtools port)" test.log | head
            exit 1
          fi
          # Case-INSENSITIVE: Odoo logs "TOUR <name> SUCCEEDED" in capitals,
          # so the previous case-sensitive pattern matched nothing and this
          # step failed even on a run where all seven tours passed. A guard
          # against hollow green that is itself hollow is worse than none.
          tours=$(grep -ciE "TOUR [a-z_]+ SUCCEEDED" test.log || true)
          echo "browser tours succeeded: ${tours}"
          # Pin the count. ">0" would still pass if six of seven silently
          # stopped being run, which is the failure mode this guards.
          expected=$(grep -roE "web_tour.tours\").add\(\"[a-z_]+" dw_git/static/src/tours | wc -l | tr -d " ")
          echo "tours registered in the addon: ${expected}"
          if [ "${tours}" -lt "${expected}" ]; then
            echo "::error::only ${tours} of ${expected} browser tours reported success"
            exit 1
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odoo-logs
          path: |
            install.log
            test.log
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
