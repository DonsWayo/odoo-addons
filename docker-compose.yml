services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - HOST=postgres
      - USER=odoo
      - PASSWORD=odoo
      - DATABASE=odoo
    volumes:
      - odoo_data:/var/lib/odoo
    ports:
      - "8069:8069"
      - "8072:8072"
    stdin_open: true
    tty: true
    command: odoo

volumes:
  postgres_data:
  odoo_data:
